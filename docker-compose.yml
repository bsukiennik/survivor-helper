services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoemploi
      POSTGRES_PASSWORD: geoemploi
      POSTGRES_DB: geoemploi
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18's image stores data under /var/lib/postgresql itself
      # (major-version-specific subdirectories, pg_ctlcluster-style) —
      # mounting at .../data as earlier images did makes the image refuse
      # to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geoemploi -d geoemploi']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://geoemploi:geoemploi@db:5432/geoemploi
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/backend:/workspace/apps/backend
      - /workspace/apps/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/workspace/apps/frontend
      - /workspace/apps/frontend/node_modules

volumes:
  db-data:
